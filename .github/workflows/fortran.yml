name: Build Fortran SDK and packages

on:
  workflow_dispatch:
    inputs:
      jobs:
        description: Parallel jobs (0 chooses from runner CPU and RAM)
        type: choice
        options: ["0", "1", "2", "4"]
        default: "0"
      publish_release:
        description: Publish SDK and five APKs as a permanent GitHub Release
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: fortran-${{ github.ref }}
  cancel-in-progress: false

jobs:
  fortran:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    permissions:
      contents: write
    env:
      TZ: Asia/Shanghai
      LC_ALL: C.UTF-8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Validate repository configuration
        run: python3 scripts/build.py fortran --plan
      - name: Prepare runner
        run: bash scripts/prepare-runner.sh fortran
      - name: Check build scripts
        run: bash scripts/check.sh
      - name: Build SDK and native Fortran packages
        env:
          BUILD_JOBS: ${{ inputs.jobs }}
        run: bash scripts/build-fortran.sh --jobs "$BUILD_JOBS"
      - name: Upload output and diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fortran-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist/fortran/
          if-no-files-found: warn
          compression-level: 0
          retention-days: 30
      - name: Publish release
        if: ${{ success() && inputs.publish_release }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/publish.py fortran

