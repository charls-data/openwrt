name: Build firmware

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publish a permanent GitHub Release in addition to the artifact
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: firmware-${{ github.ref }}
  cancel-in-progress: false

jobs:
  firmware:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    permissions:
      contents: write
    env:
      TZ: Asia/Shanghai
      LC_ALL: C.UTF-8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Validate repository configuration
        run: python3 scripts/build.py firmware --plan
      - name: Prepare runner
        run: bash scripts/prepare-runner.sh firmware
      - name: Check build scripts
        run: bash scripts/check.sh
      - name: Build firmware
        run: bash scripts/build-firmware.sh
      - name: Upload output and diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: firmware-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist/firmware/
          if-no-files-found: warn
          compression-level: 0
          retention-days: 30
      - name: Publish release
        if: ${{ success() && inputs.publish_release }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/publish.py firmware

